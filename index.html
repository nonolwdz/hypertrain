<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypertrain | Dark Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Modale de connexion -->
    <div id="auth-modal" class="modal hidden">
        <div class="modal-content">
            <button id="btn-close-modal" class="btn-icon-close"><i class="ph ph-x"></i></button>
            <div class="modal-header">
                <h2>Connexion</h2>
                <p>Sauvegardez vos trajets favoris.</p>
            </div>
            <div id="auth-error" class="error-msg hidden"></div>
            <div class="input-modern">
                <i class="ph ph-envelope"></i>
                <input type="email" id="auth-email" placeholder="E-mail">
            </div>
            <div class="input-modern">
                <i class="ph ph-lock"></i>
                <input type="password" id="auth-password" placeholder="Mot de passe (6 car. min)">
            </div>
            <div class="auth-buttons">
                <button id="btn-login" class="btn-primary">Se connecter</button>
                <button id="btn-register" class="btn-secondary">Créer mon compte</button>
            </div>
        </div>
    </div>

    <div class="app-container">
        <header>
            <div class="logo">
                <i class="ph-fill ph-train" style="color: var(--primary);"></i> Hypertrain
            </div>
            <div class="header-actions">
                <button id="btn-logout" class="btn-text hidden">Déconnexion</button>
                <div class="user-profile" id="btn-user-profile">
                    <span id="user-name">Connexion</span>
                    <i class="ph-fill ph-user-circle"></i>
                </div>
            </div>
        </header>

        <main>
            <section class="hero-section">
                <h1>Où allons-nous ?</h1>
                
                <div class="search-box">
                    <div class="search-inputs">
                        <div class="input-group">
                            <i class="ph ph-map-pin icon"></i>
                            <input type="text" id="depart" placeholder="Départ..." autocomplete="off">
                            <div id="autocomplete-depart" class="autocomplete-list hidden"></div>
                        </div>
                        
                        <button class="btn-swap" id="btn-swap"><i class="ph ph-arrows-down-up"></i></button>
                        
                        <div class="input-group">
                            <i class="ph ph-flag-checkered icon"></i>
                            <input type="text" id="arrivee" placeholder="Arrivée..." autocomplete="off">
                            <div id="autocomplete-arrivee" class="autocomplete-list hidden"></div>
                        </div>
                    </div>

                    <!-- Options de réduction -->
                    <div class="options-bar">
                        <label class="toggle-option">
                            <input type="checkbox" id="carte-scolaire">
                            <span class="custom-checkbox"><i class="ph-fill ph-check"></i></span>
                            Carte Scolaire + Mobilité (Gratuit sur TER Auvergne-Rhône-Alpes)
                        </label>
                    </div>

                    <button id="btn-recherche" class="btn-search">Rechercher</button>
                </div>
            </section>

            <section id="results-section" class="hidden fade-in">
                <div class="section-header">
                    <h2>Prochains départs</h2>
                    <button id="btn-save-favori" class="btn-save hidden"><i class="ph-fill ph-star"></i> Sauvegarder</button>
                </div>
                <div id="results-container" class="results-list"></div>
            </section>

            <section class="favorites-section">
                <div class="section-header">
                    <h2>Trajets favoris</h2>
                </div>
                <div class="favorites-grid" id="favorites-container">
                    <div class="empty-state">
                        <p>Connectez-vous pour retrouver vos recherches rapides.</p>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
