<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypertrain | Voyage premium</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Fenêtre modale de connexion -->
    <div id="auth-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Connexion Hypertrain</h2>
            <input type="email" id="auth-email" placeholder="Adresse e-mail">
            <input type="password" id="auth-password" placeholder="Mot de passe">
            <div class="auth-buttons">
                <button id="btn-login" class="btn-primary">Se connecter</button>
                <button id="btn-register" class="btn-secondary">Créer un compte</button>
            </div>
            <button id="btn-close-modal" class="btn-text">Fermer</button>
        </div>
    </div>

    <div class="app-container">
        <header>
            <div class="logo">⚡ Hypertrain</div>
            <div class="user-profile" id="btn-user-profile">
                <span id="user-name">Se connecter</span>
                <div class="avatar"></div>
            </div>
            <button id="btn-logout" class="btn-text hidden">Déconnexion</button>
        </header>

        <main>
            <section class="search-section">
                <h1>Où allez-vous ?</h1>
                <div class="search-box">
                    <div class="input-group">
                        <input type="text" id="depart" placeholder="Départ (ex: Montluçon)">
                        <div id="autocomplete-depart" class="autocomplete-list hidden"></div>
                    </div>
                    <button class="btn-swap" id="btn-swap">⇄</button>
                    <div class="input-group">
                        <input type="text" id="arrivee" placeholder="Arrivée (ex: Paris)">
                        <div id="autocomplete-arrivee" class="autocomplete-list hidden"></div>
                    </div>
                    <button id="btn-recherche" class="btn-primary">Rechercher</button>
                </div>
            </section>

            <section id="results-section" class="hidden">
                <div class="results-header">
                    <h2>Résultats</h2>
                    <button id="btn-save-favori" class="btn-secondary hidden">⭐ Sauvegarder ce trajet</button>
                </div>
                <div id="results-container" class="results-list"></div>
            </section>

            <section class="favorites-section">
                <h2>Mes Trajets Sauvegardés</h2>
                <div class="favorites-grid" id="favorites-container">
                    <p class="text-muted">Connectez-vous pour voir vos favoris.</p>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
